<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Povratna veza</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app shell with top bar; editor = left rail + work panel + sticky action bar; live = projector stage. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --sunk:#e3e8f0; --line:#cdd5e1;
  --ink:#141a2e; --ink-2:#4a5470; --ink-3:#7b849c;
  --accent:#2747d4; --accent-ink:#ffffff; --accent-soft:#e1e7fd;
  --ok:#1f8a4c; --ok-soft:#dcf2e5; --bad:#c92a2a; --bad-soft:#fbe1e1; --warn:#b5650d;
  --a0:#e0502a; --a1:#1f72d6; --a2:#d39b06; --a3:#7a3fd1; --a4:#0f8c86; --a5:#c2387c;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,26,46,.06), 0 6px 20px rgba(20,26,46,.07);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1322; --surface:#181e31; --sunk:#111627; --line:#2c3550;
  --ink:#eef1f8; --ink-2:#b4bcd2; --ink-3:#7f89a5;
  --accent:#7d95ff; --accent-ink:#0f1322; --accent-soft:#232d55;
  --ok:#4cc882; --ok-soft:#173826; --bad:#ff7b7b; --bad-soft:#3d1d22; --warn:#f0a648;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1322; --surface:#181e31; --sunk:#111627; --line:#2c3550;
  --ink:#eef1f8; --ink-2:#b4bcd2; --ink-3:#7f89a5;
  --accent:#7d95ff; --accent-ink:#0f1322; --accent-soft:#232d55;
  --ok:#4cc882; --ok-soft:#173826; --bad:#ff7b7b; --bad-soft:#3d1d22; --warn:#f0a648;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.35rem;font-weight:650} h3{font-size:1.05rem;font-weight:650}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1.5px solid transparent;border-radius:999px;padding:.55em 1.2em;font-weight:700;cursor:pointer;background:var(--sunk);color:var(--ink);white-space:nowrap;transition:transform .08s, background .15s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:.35em .85em;font-size:.88rem}
.btn.lg{padding:.8em 1.8em;font-size:1.15rem}
.icon-btn{border:0;background:transparent;padding:.35em;border-radius:8px;cursor:pointer;color:var(--ink-2);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--f-display);font-weight:750;font-size:1.15rem;cursor:pointer}
.brand svg{width:30px;height:30px}
.topbar .sp{flex:1}
.mode-chip{font-size:.75rem;font-weight:700;padding:.2em .7em;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 60px}
.field{display:grid;gap:.35rem}
.field > span{font-size:.9rem;font-weight:700;color:var(--ink-2)}
.field .req{color:var(--bad)}
.input,textarea.input,select.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.65em .8em;min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:6.5em}
.count{font-size:.78rem;color:var(--ink-3);justify-self:end}
.err{color:var(--bad);font-size:.9rem;font-weight:700}

/* home */
.home-head{display:flex;flex-wrap:wrap;gap:1rem;align-items:end;justify-content:space-between;margin-bottom:1.4rem}
.grid-q{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.qcard .cover{aspect-ratio:16/9;background:var(--sunk);display:grid;place-items:center;overflow:hidden;max-width:100%}
.qcard .cover img{width:100%;height:100%;object-fit:cover}
.qcard .cover .ph{font-family:var(--f-display);font-weight:750;font-size:1.4rem;color:var(--ink-3);padding:1rem;text-align:center}
.qcard .body{padding:14px 16px 16px;display:grid;gap:.6rem;flex:1}
.qcard .meta{display:flex;gap:.8rem;font-size:.85rem;color:var(--ink-2)}
.qcard .acts{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:auto}
.section-gap{margin-top:2.6rem}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.t{border-collapse:collapse;width:100%;font-size:.93rem}
table.t th,table.t td{padding:.6em .9em;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--sunk)}
table.t td.num,table.t th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
.empty{padding:2rem;text-align:center;color:var(--ink-2);background:var(--surface);border:1.5px dashed var(--line);border-radius:14px}

/* editor */
.editor{max-width:1240px;margin:0 auto;padding:20px 20px 0;display:grid;grid-template-columns:330px minmax(0,1fr);gap:0;min-height:calc(100vh - 64px)}
.rail{background:var(--sunk);border-radius:14px 0 0 0;display:flex;flex-direction:column;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr}
.tab{border:0;padding:1em;font-weight:750;letter-spacing:.06em;font-size:.85rem;text-transform:uppercase;cursor:pointer;background:var(--ink);color:var(--ink-3);display:flex;gap:.5em;justify-content:center;align-items:center}
.tab:first-child{border-radius:14px 0 0 0}
.tab[aria-selected="true"]{background:var(--sunk);color:var(--accent)}
.rail-list{padding:14px;display:grid;gap:8px;align-content:start}
.step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;border:0;border-radius:12px;padding:12px;background:transparent;cursor:pointer}
.step .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff}
.step.bad .dot{background:var(--warn)}
.step b{display:block;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase}
.step small{color:var(--ink-2);font-size:.82rem;line-height:1.3;display:block}
.step[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.step[aria-current="true"] small{color:inherit;opacity:.85}
.step[aria-current="true"] .dot{background:rgba(255,255,255,.25)}
.qitem{display:grid;grid-template-columns:auto 34px minmax(0,1fr) auto;gap:8px;align-items:center;border-radius:12px;padding:8px;background:transparent;cursor:pointer;border:0;text-align:left}
.qitem .mv{display:grid;gap:0}
.qitem .mv button{border:0;background:transparent;padding:0 2px;cursor:pointer;color:var(--ink-3);line-height:1}
.qitem .chk{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.qitem.bad .chk{background:var(--bad-soft);color:var(--bad)}
.qitem .tt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem}
.qitem[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.qitem[aria-current="true"] .mv button{color:inherit}
.panel{background:var(--surface);border-radius:0 14px 0 0;display:flex;flex-direction:column;min-width:0}
.panel-head{display:flex;align-items:center;gap:.8rem;padding:18px 26px;border-bottom:1px solid var(--line)}
.panel-head h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.panel-body{padding:24px 26px 40px;display:grid;gap:22px;align-content:start;flex:1}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px}
.media{border-radius:var(--r);background:var(--sunk);min-height:200px;display:grid;place-items:center;position:relative;overflow:hidden;border:1.5px dashed var(--line);cursor:pointer}
.media img{max-height:260px;object-fit:contain}
.media .tag{position:absolute;left:10px;top:10px;background:var(--surface);border-radius:999px;font-size:.75rem;font-weight:700;padding:.2em .7em}
.media .rm{position:absolute;right:8px;top:8px;background:var(--surface)}
.media .hint{color:var(--ink-2);text-align:center;padding:1rem;font-size:.92rem}
.ans{display:grid;grid-template-columns:44px minmax(0,1fr) 38px;gap:12px;align-items:center}
.ans .tick{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:transparent}
.ans .tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ans .box{display:flex;align-items:center;gap:.7rem;border:1.5px solid var(--line);border-radius:var(--r);padding:.2em .8em;background:var(--surface)}
.ans .box:focus-within{border-color:var(--accent)}
.ans .box .letter{font-family:var(--f-mono);color:var(--ink-3);font-weight:700}
.ans .box input{border:0;outline:0;background:transparent;flex:1;padding:.55em 0;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:end}
.row > .field{flex:1 1 200px}
.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem 1rem;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.setting h3{font-size:1.05rem}
.setting p{grid-column:1;color:var(--ink-2);font-size:.9rem}
.setting .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:16px;padding-top:.6rem}
.setting .sub .field{flex:1 1 180px}
.switch{position:relative;width:62px;height:32px;border-radius:999px;border:0;background:var(--line);cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(30px)}
.actionbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 26px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:5}
.actionbar .sp{flex:1}
.dirty{font-size:.85rem;color:var(--warn);font-weight:700}
.codebox{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.codebox .code{font-family:var(--f-mono);font-size:1.4rem;font-weight:700;letter-spacing:.12em;background:var(--accent-soft);color:var(--accent);padding:.35em .8em;border-radius:var(--r)}

/* live stage */
.stage{min-height:calc(100vh - 64px);display:flex;flex-direction:column}
.stage-top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.stage-top .sp{flex:1}
.stage-main{flex:1;padding:28px 24px;max-width:1300px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.lobby{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:40px;align-items:start}
.qr{background:#fff;padding:18px;border-radius:18px;box-shadow:var(--shadow);display:grid;gap:10px;justify-items:center;max-width:100%}
.qr #qrcode img,.qr #qrcode canvas{width:min(340px,70vw)!important;height:auto!important}
.qr .url{font-family:var(--f-mono);font-size:.82rem;color:#333;word-break:break-all;text-align:center;max-width:340px}
.bigcode{font-family:var(--f-mono);font-size:clamp(2.4rem,6vw,4.2rem);font-weight:700;letter-spacing:.14em;line-height:1}
.counter{display:flex;align-items:baseline;gap:.6rem}
.counter .n{font-family:var(--f-display);font-size:clamp(4rem,10vw,7rem);font-weight:800;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.3em .85em;font-weight:700;animation:pop .3s ease-out both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.qhead{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.qtext{font-family:var(--f-display);font-size:clamp(1.6rem,3.4vw,2.7rem);font-weight:700;line-height:1.15;text-wrap:balance}
.qbody{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:start}
.qimg{background:#fff;border-radius:14px;padding:10px;max-width:min(520px,100%)}
.qimg img{max-height:42vh;object-fit:contain;display:block;margin:auto}
.timer{position:relative;width:96px;height:96px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:1.9rem;font-weight:700}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.abtn{display:flex;align-items:center;gap:16px;text-align:left;border:0;border-radius:14px;padding:18px 20px;color:#fff;font-size:clamp(1.05rem,2vw,1.45rem);font-weight:700;min-height:84px;position:relative;transition:opacity .2s, transform .1s}
.abtn .L{font-family:var(--f-mono);background:rgba(255,255,255,.22);border-radius:10px;width:2.1em;height:2.1em;display:grid;place-items:center;flex:none}
.abtn .tx{flex:1;min-width:0}
.abtn .cnt{font-family:var(--f-mono);font-size:1.1em;background:rgba(0,0,0,.18);padding:.15em .55em;border-radius:8px}
.abtn.dim{opacity:.32}
.abtn.right{outline:5px solid var(--ok);outline-offset:3px}
.abtn .mark{display:grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:#fff;color:var(--ok);flex:none}
.c0{background:var(--a0)}.c1{background:var(--a1)}.c2{background:var(--a2)}.c3{background:var(--a3)}.c4{background:var(--a4)}.c5{background:var(--a5)}
.progress{display:flex;align-items:center;gap:.8rem;font-weight:700;color:var(--ink-2)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;flex:1;min-width:120px}
.bar > i{display:block;height:100%;background:var(--accent);transition:width .3s}
.board{display:grid;gap:8px;max-width:760px;width:100%}
.brow{display:grid;grid-template-columns:3rem minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:700;font-size:1.1rem}
.brow .rk{font-family:var(--f-mono);color:var(--ink-3)}
.brow:first-child{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.brow .pts{font-family:var(--f-mono)}
.big-count{font-family:var(--f-display);font-size:min(30vw,14rem);font-weight:800;text-align:center;color:var(--accent);line-height:1}
.center{display:grid;place-items:center;text-align:center;gap:1rem}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:.9rem 1.1rem;font-size:.95rem}
.note.warn{background:var(--bad-soft)}

/* player */
.pl{min-height:100vh;display:flex;flex-direction:column}
.pl-top{display:flex;align-items:center;gap:.8rem;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.pl-top .sp{flex:1}
.pl-main{flex:1;padding:22px 16px 40px;max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:16px;box-shadow:var(--shadow)}
.pl .answers{grid-template-columns:1fr}
.pl .abtn{min-height:70px;font-size:1.1rem;cursor:pointer}
.pl .abtn:disabled{cursor:default}
.pl .abtn.picked{outline:4px solid var(--ink);outline-offset:3px}
.result{border-radius:16px;padding:24px;text-align:center;display:grid;gap:8px}
.result.ok{background:var(--ok-soft)} .result.no{background:var(--bad-soft)} .result.na{background:var(--sunk)}
.result .pts{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:1}
.no-copy{-webkit-user-select:none;user-select:none}
.thinbar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.thinbar > i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7em 1.2em;border-radius:12px;font-weight:700;z-index:99;box-shadow:var(--shadow)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,28,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--bg);border-radius:18px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:24px;display:grid;gap:18px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}

@media (max-width:860px){
  .editor{grid-template-columns:1fr;padding:12px 12px 0}
  .rail{border-radius:14px 14px 0 0}
  .tab:first-child{border-radius:14px 0 0 0}.tab:last-child{border-radius:0 14px 0 0}
  .panel{border-radius:0}
  .two,.lobby,.qbody{grid-template-columns:1fr}
  .answers{grid-template-columns:1fr}
  .panel-body,.panel-head,.actionbar{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.topbar,.stage-top,.no-print{display:none!important} body{background:#fff;color:#000}}
.abtn.neutral{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.abtn.neutral .cnt{background:var(--sunk)}
.abtn.neutral.right{background:var(--ok-soft)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end;max-width:900px;width:100%;margin:0 auto}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 14px;display:grid;gap:4px;text-align:center;min-width:0}
.pod b{font-size:1.15rem;overflow-wrap:anywhere}
.pod.p1{order:2;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);padding-block:34px}
.pod.p2{order:1;padding-block:24px}.pod.p3{order:3}
.pod .place{font-family:var(--f-display);font-size:2.4rem;font-weight:800;color:var(--accent);line-height:1}
@media (max-width:640px){.podium{grid-template-columns:1fr}.pod.p1,.pod.p2,.pod.p3{order:0}}

</style>

  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function download(name, text, type) {
  try {
    const url = URL.createObjectURL(new Blob([text], {type}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  } catch (e) { toast('Preuzimanje nije uspjelo u ovom pregledniku.'); }
}
function sget(st, k) { try { return st.getItem(k); } catch (e) { return null; } }
function sset(st, k, v) { try { st.setItem(k, v); } catch (e) {} }

const TS_LOCAL = {'.sv':'timestamp'};
function makeLocalDB() {
  const KEY = 'povratna-veza-db';
  let mem = {};
  const load = () => { const s = sget(localStorage, KEY); try { return s ? JSON.parse(s) : mem; } catch (e) { return mem; } };
  let tree = load();
  const subs = new Set();
  const parts = p => String(p).split('/').filter(Boolean);
  const getAt = p => { let n = tree; for (const k of parts(p)) { if (n == null || typeof n !== 'object') return null; n = n[k]; } return n === undefined ? null : n; };
  const resolveTS = v => {
    if (v && typeof v === 'object') {
      if (v['.sv'] === 'timestamp') return Date.now();
      const o = Array.isArray(v) ? [] : {};
      for (const k in v) o[k] = resolveTS(v[k]);
      return o;
    }
    return v;
  };
  const setAt = (p, v) => {
    v = resolveTS(clone(v));
    const ks = parts(p);
    if (!ks.length) { tree = v || {}; return; }
    let n = tree;
    for (let i = 0; i < ks.length - 1; i++) { if (n[ks[i]] == null || typeof n[ks[i]] !== 'object') n[ks[i]] = {}; n = n[ks[i]]; }
    if (v === null || v === undefined) delete n[ks[ks.length - 1]]; else n[ks[ks.length - 1]] = v;
  };
  const save = () => { mem = tree; sset(localStorage, KEY, JSON.stringify(tree)); };
  const fireOne = s => { const v = getAt(s.p); const j = JSON.stringify(v); if (j !== s.last) { s.last = j; s.cb(v == null ? null : JSON.parse(j)); } };
  const fire = () => subs.forEach(fireOne);
  window.addEventListener('storage', e => { if (e.key === KEY) { tree = load(); fire(); } });
  return {
    mode: 'demo',
    TS: TS_LOCAL,
    now: () => Date.now(),
    get: p => Promise.resolve(clone(getAt(p))),
    set: (p, v) => { setAt(p, v); save(); fire(); return Promise.resolve(); },
    update: (p, o) => { for (const k in o) setAt(p + '/' + k, o[k]); save(); fire(); return Promise.resolve(); },
    remove: p => { setAt(p, null); save(); fire(); return Promise.resolve(); },
    on: (p, cb) => { const s = {p, cb, last: undefined}; subs.add(s); setTimeout(() => subs.has(s) && fireOne(s), 0); return () => subs.delete(s); }
  };
}
function makeFireDB(fb) {
  const db = fb.database();
  let offset = 0;
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  return {
    mode: 'firebase',
    TS: fb.database.ServerValue.TIMESTAMP,
    now: () => Date.now() + offset,
    get: p => db.ref(p).get().then(s => s.val()),
    set: (p, v) => db.ref(p).set(v),
    update: (p, o) => db.ref(p).update(o),
    remove: p => db.ref(p).remove(),
    on: (p, cb) => { const r = db.ref(p); const f = s => cb(s.val()); r.on('value', f, err => console.warn('Pretplata odbijena:', p, err && err.message)); return () => r.off('value', f); }
  };
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Ne mogu učitati ' + src)); document.head.appendChild(s); });
}

let DB = null, UID = null, FB = null;

async function boot() {
  const fbcfg = CFG.firebase && CFG.firebase.apiKey && CFG.firebase.databaseURL ? CFG.firebase : null;
  if (fbcfg) {
    try {
      const v = '10.12.2';
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-database-compat.js`);
      FB = window.firebase; FB.initializeApp(fbcfg);
      DB = makeFireDB(FB);
    } catch (e) {
      app.innerHTML = `<div class="wrap"><div class="note warn"><b>Ne mogu se spojiti na Firebase.</b> ${esc(e.message)}. Provjerite internetsku vezu i postavke u KVIZ_CONFIG.</div></div>`;
      return;
    }
  } else {
    DB = makeLocalDB();
  }
  if (IS_PLAYER) Player.start(); else Host.start();
}

const fmtP = n => (Math.round((n || 0) * 100) / 100).toLocaleString('hr-HR');
const fmtS = ms => ((ms || 0) / 1000).toLocaleString('hr-HR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
function newQuestion() { return {id: rid(8), text: '', image: null, answers: ['', '', '', ''], correct: 0}; }
function newQuiz() {
  return {id: rid(10), title: '', updatedAt: Date.now(), points: 0.5, qTime: 30, revealTime: 10, bonusOn: false, bonus: 0.5, shuffleA: true, questions: [newQuestion()]};
}
function normQuiz(q) {
  const o = Object.assign(newQuiz(), q || {});
  o.questions = (Array.isArray(o.questions) ? o.questions : Object.values(o.questions || {})).map(x => {
    const n = Object.assign(newQuestion(), x || {});
    let ans = Array.isArray(n.answers) ? n.answers : Object.values(n.answers || {});
    if (ans.length && typeof ans[0] === 'object') { const ci = ans.findIndex(a => a && a.correct); n.correct = ci < 0 ? 0 : ci; ans = ans.map(a => (a && a.text) || ''); }
    n.answers = ans.map(a => String(a || ''));
    while (n.answers.length < 2) n.answers.push('');
    n.correct = Math.min(Math.max(0, n.correct | 0), n.answers.length - 1);
    return n;
  });
  ['points', 'qTime', 'revealTime', 'bonus'].forEach(k => { o[k] = Number(o[k]) || 0; });
  return o;
}
function qProblems(q) {
  const p = [];
  if (!q.text.trim()) p.push('Nedostaje tekst pitanja');
  if (q.answers.filter(a => a.trim()).length < 2) p.push('Potrebna su barem 2 ponuđena odgovora');
  if (!(q.answers[q.correct] || '').trim()) p.push('Označeni točan odgovor je prazan');
  return p;
}
function quizProblems(q) {
  const p = [];
  if (!q.title.trim()) p.push('Upišite naslov kviza');
  if (!(q.points > 0)) p.push('Bodovi za točan odgovor moraju biti veći od 0');
  if (!(q.qTime >= 5)) p.push('Vrijeme za odgovor mora biti barem 5 s');
  if (!(q.revealTime >= 2)) p.push('Prikaz točnog odgovora mora trajati barem 2 s');
  if (q.bonusOn && !(q.bonus > 0)) p.push('Upišite iznos bonusa');
  return p;
}
/* poredak: više točnih odgovora, pa manje ukupno vrijeme točnih odgovora */
function rankCmp(a, b) { return (b.correct || 0) - (a.correct || 0) || (a.time || 0) - (b.time || 0); }
function seeded(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
function seededOrder(n, key) { const r = seeded(key); const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

      <aside class="rail"><div class="tabs" role="tablist">

      p.onpaste = e => { const f = Array.from(e.clipboardData.files || []).find(f => f.type.startsWith('image/')); if (f) { e.preventDefault(); this.readImg(f).then(u => { x.image = u; this.mark(); this.renderPane(); }); } };

  },
  status() {
    this.refreshRail();
    const se = $('#set-err'); if (se) se.textContent = quizProblems(this.q).join(' · ');
    const x = this.q.questions[this.qi]; if (!x || this.tab !== 'pit') return; const prob = qProblems(x);
    const c = $('#q-chk'); if (c) { c.style.color = prob.length ? 'var(--bad)' : 'var(--ok)'; c.innerHTML = prob.length ? '!' : I.check; }
    const e = $('#q-err'); if (e) e.textContent = prob.join(' · ');
  },
  bindMedia(box, input, done) {
    box.onclick = e => { if (e.target.closest('.rm')) return; input.click(); };
    box.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
    input.onchange = () => { const f = input.files[0]; if (f) this.readImg(f).then(done); input.value = ''; };
    box.ondragover = e => { e.preventDefault(); box.style.borderColor = 'var(--accent)'; };
    box.ondragleave = () => { box.style.borderColor = ''; };
    box.ondrop = e => { e.preventDefault(); box.style.borderColor = ''; const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) this.readImg(f).then(done); };
  },
  readImg(file) {
    return new Promise((res, rej) => {
      const rd = new FileReader();
      rd.onload = () => { const im = new Image(); im.onload = () => {
        const k = Math.min(1, 1000 / im.width, 800 / im.height); const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .85)); }; im.onerror = () => { toast('Slika se ne može učitati.'); rej(); }; im.src = rd.result; };
      rd.readAsDataURL(file);
    });
  },
  preview(x) {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-label="Pregled pitanja"><div class="qhead"><span class="label" style="flex:1">Pregled · točan odgovor je istaknut</span><button class="icon-btn" aria-label="Zatvori">${I.x}</button></div>

      <div class="answers">${x.answers.map((a, i) => a.trim() ? `<div class="abtn c${i} ${x.correct === i ? 'right' : ''}"><span class="L">${LET[i]}</span><span class="tx">${esc(a)}</span>${x.correct === i ? `<span class="mark">${I.check}</span>` : ''}</div>` : '').join('')}</div></div>`;
    bg.onclick = e => { if (e.target === bg || e.target.closest('.icon-btn')) bg.remove(); };

  async save() {
    const q = this.q;
    if (!q.title.trim()) { this.setTab('set'); toast('Upišite naslov kviza.'); $('#f-title').focus(); return; }
    q.updatedAt = Date.now();
    try { await DB.set('quizzes/' + q.id, clone(q)); this.dirty = false; $('#dirty').hidden = true; toast('Spremljeno'); }
    catch (e) { toast('Spremanje nije uspjelo: ' + (e.message || 'provjerite vezu'), 5000); }
  }
};

const COUNTDOWN = 5;
const Live = {
  code: null, meta: null, secret: null, state: null, players: {}, scores: {}, curAnswers: {}, unsubs: [], timer: null, busy: false, auto: true, ansUnsub: null,
  async create(quiz) {
    quiz = normQuiz(quiz);
    let code;
    for (let i = 0; i < 12; i++) { code = String(100000 + Math.floor(Math.random() * 900000)); if (!(await DB.get('games/' + code + '/meta'))) break; }
    const qs = quiz.questions.map(x => {
      const list = x.answers.map((t, i) => ({t: t.trim(), ok: i === x.correct})).filter(a => a.t);
      return {text: x.text.trim(), image: x.image || null, answers: list.map(a => a.t), correct: Math.max(0, list.findIndex(a => a.ok))};
    });
    const meta = {title: quiz.title, createdAt: DB.TS, host: UID, total: qs.length, shuffleA: !!quiz.shuffleA};
    const settings = {points: quiz.points, qTime: quiz.qTime, revealTime: quiz.revealTime, bonusOn: !!quiz.bonusOn, bonus: quiz.bonusOn ? quiz.bonus : 0};
    try {
      await DB.set('games/' + code + '/secret', {questions: qs, settings});
      await DB.set('games/' + code + '/meta', meta);
      await DB.set('games/' + code + '/state', {phase: 'lobby'});
      await DB.set('history/' + code, {title: quiz.title, createdAt: DB.TS, players: 0, ended: false});
    } catch (e) { toast('Pokretanje nije uspjelo: ' + (e.message || ''), 5000); return; }
    this.open(code);
  },
  async open(code) {
    Host.cleanup();
    this.code = code; this.players = {}; this.scores = {}; this.curAnswers = {}; this.state = null; this.busy = false; this.auto = true;
    history.replaceState(null, '', location.pathname + location.search + '#uzivo-' + code);
    app.innerHTML = `${Host.topbar(`<button class="btn ghost sm" id="fs">${I.full} Cijeli zaslon</button>`)}<div class="stage"><div class="stage-top" id="stop"></div><div class="stage-main" id="smain"><div class="empty">Učitavam kviz…</div></div></div>`;
    Host.wire(app);
    $('#fs').onclick = () => { const d = document.documentElement; Promise.resolve().then(() => document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen()).catch(() => toast('Cijeli zaslon nije dostupan; pritisnite F11.')); };
    this.meta = await DB.get('games/' + code + '/meta');
    this.secret = await DB.get('games/' + code + '/secret');
    if (!this.meta || !this.secret) { $('#smain').innerHTML = `<div class="empty">Kviz s kodom ${esc(code)} ne postoji.</div>`; return; }
    this.secret.questions = (Array.isArray(this.secret.questions) ? this.secret.questions : Object.values(this.secret.questions)).map(q => Object.assign(q, {answers: Array.isArray(q.answers) ? q.answers : Object.values(q.answers)}));
    this.unsubs.push(DB.on('games/' + code + '/players', v => { this.players = v || {}; this.onPlayers(); }));
    this.unsubs.push(DB.on('games/' + code + '/scores', v => { this.scores = v || {}; }));
    this.unsubs.push(DB.on('games/' + code + '/state', v => { const old = this.state; this.state = v || {phase: 'lobby'}; this.onState(old); }));
    this.timer = setInterval(() => this.tick(), 200);
  },
  get S() { return this.secret.settings; },
  baseURL() {
    if (CFG.joinBaseURL) return CFG.joinBaseURL.replace(/\/?$/, '/');
    return location.origin && location.origin !== 'null' && /^https?:/.test(location.protocol) ? location.origin + location.pathname : '';
  },
  pcount() { return Object.keys(this.players).length; },

          <div class="counter"><span class="n" id="pcount2">${this.pcount()}</span><span class="muted" style="font-size:1.2rem;font-weight:700">prijavljenih natjecatelja</span></div>

      this.curAnswers = {};

    } else if (s.phase === 'reveal') {

  timerSVG() { return `<div class="timer"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="var(--sunk)" stroke-width="10" fill="none"/><circle id="tarc" cx="50" cy="50" r="44" stroke="var(--accent)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><span class="t" id="tnum">–</span></div>`; },
  drawQR(text) {

    el.innerHTML = `<div style="padding:2rem;color:#333;max-width:300px">QR kod se nije učitao. Natjecatelji mogu otvoriti link i upisati kod.</div>`;
  },
  async begin() {
    if (this.busy) return; this.busy = true;

  async showQ(i) {
    const q = this.secret.questions[i];

  tick() {
    const s = this.state; if (!s || this.busy) return;
    const now = DB.now(); const at = typeof s.at === 'number' ? s.at : null; if (!at) return;

    } else if (s.phase === 'question') {
      const tot = s.time * 1000; const left = Math.max(0, at + tot - now);
      const tn = $('#tnum'); if (tn) tn.textContent = Math.ceil(left / 1000);
      const arc = $('#tarc'); if (arc) arc.setAttribute('stroke-dashoffset', String(276.5 * (1 - left / tot)));
      const n = this.pcount(); const a = Object.keys(this.curAnswers).length;

    } else if (s.phase === 'reveal') {

  async reveal() {
    const s = this.state; if (this.busy || !s || s.phase !== 'question') return; this.busy = true;

      const qi = s.qi; const q = this.secret.questions[qi];
      const answers = (await DB.get(`games/${this.code}/answers/${qi}`)) || {};
      const start = s.at; const lim = s.time * 1000;
      const dist = q.answers.map(() => 0); const upd = {};
      new Set([...Object.keys(this.players), ...Object.keys(this.scores)]).forEach(u => {
        const prev = this.scores[u] || {correct: 0, time: 0, perQ: {}};
        const a = answers[u]; let ok = false; let ms = null; let c = null;
        if (a && typeof a.c === 'number' && a.c >= 0 && a.c < q.answers.length) {
          c = a.c; dist[c]++;
          ms = Math.max(0, Math.min(lim, (a.at || start + lim) - start));
          ok = c === q.correct && (a.at || 0) <= start + lim + 1500;
        }
        const perQ = Object.assign({}, prev.perQ || {}); perQ[qi] = {c, ok, ms};

  },
  async end() {

  },
  async finish() {
    const S = this.S; const ids = new Set([...Object.keys(this.players), ...Object.keys(this.scores)]);
    const list = [...ids].map(u => Object.assign({u}, this.scores[u] || {correct: 0, time: 0, perQ: {}}));
    list.sort(rankCmp);
    const upd = {};
    list.forEach((r, i) => {

      upd[r.u] = Object.assign({}, this.scores[r.u] || {correct: 0, time: 0, perQ: {}}, {rank: i + 1, of: list.length, points: base, bonus, total: Math.round((base + bonus) * 100) / 100});
    });
    await DB.set(`games/${this.code}/scores`, upd); this.scores = upd;
    await DB.set(`games/${this.code}/board`, list.slice(0, 10).map(r => ({n: this.pname(this.players[r.u]), p: upd[r.u].total, k: r.correct || 0, t: r.time || 0})));
    const lastQ = this.state && typeof this.state.qi === 'number' ? this.state.qi + 1 : 0;

  reportRows() {

  showReport(m) {

      <div class="table-wrap"><table class="t"><thead><tr><th class="num">Mjesto</th><th>Prezime</th><th>Ime</th>${this.secret.questions.map((q, i) => `<th class="num" title="${esc(q.text)}">P${i + 1}</th>`).join('')}<th class="num">Točnih</th><th class="num">Vrijeme, s</th><th class="num">Bonus</th><th class="num">Bodovi</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td class="num">${r.rank}.</td><td><b>${esc(r.prezime)}</b></td><td>${esc(r.ime)}</td>${r.per.map(p => `<td class="num" style="color:${p.ok ? 'var(--ok)' : (p.c === null ? 'var(--ink-3)' : 'var(--bad)')}" title="${p.c === null ? 'bez odgovora' : (p.ok ? 'točno' : 'netočno') + ', ' + fmtS(p.ms) + ' s'}">${p.ok ? '✓' : (p.c === null ? '–' : '✗')}</td>`).join('')}<td class="num">${r.correct}/${nq}</td><td class="num">${fmtS(r.time)}</td><td class="num">${r.bonus ? fmtP(r.bonus) : ''}</td><td class="num"><b>${fmtP(r.total)}</b></td></tr>`).join('') || `<tr><td colspan="${nq + 7}">Nema natjecatelja.</td></tr>`}</tbody>

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.id = 'confetti'; document.body.appendChild(c);
  const g = c.getContext('2d'); const W = c.width = innerWidth; const H = c.height = innerHeight;
  const cols = ['#e0502a', '#1f72d6', '#d39b06', '#7a3fd1', '#0f8c86', '#1f8a4c'];
  const ps = Array.from({length: 160}, () => ({x: Math.random() * W, y: -Math.random() * H, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, r: Math.random() * 6.3, s: 6 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)]}));
  let t = 0; (function f() { g.clearRect(0, 0, W, H); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += .1; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); }); if (++t < 260) requestAnimationFrame(f); else c.remove(); })();
}

const Player = {
  code: null, meta: null, me: null, state: null, my: null, board: null, picked: {}, unsubs: [], timer: null,
  async start() {
    if (DB.mode === 'firebase') {

  shell(inner, top = '') {
    app.innerHTML = `<div class="pl"><header class="pl-top"><div class="brand" style="min-width:0">${LOGO}<span style="overflow:hidden;text-overflow:ellipsis">${esc(this.meta ? this.meta.title : 'Povratna veza')}</span></div><div class="sp"></div>${top}</header><main class="pl-main" id="pm">${inner}</main></div>`;
  },
  askCode(msg) {
    this.shell(`<form class="card" id="cf"><h1>Ulaz u kviz</h1><label class="field"><span>Kod kviza (6 znamenki)</span><input class="input mono" id="cf-code" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="123 456" style="font-size:1.6rem;letter-spacing:.15em;text-align:center"></label>

  async enter(code) {

    this.me = await DB.get(`games/${code}/players/${UID}`).catch(() => null);
    const st = await DB.get(`games/${code}/state`).catch(() => null);

    this.shell(`<form class="card" id="jf">

      <label class="field"><span>Prezime</span><input class="input" id="jf-prez" required maxlength="60" autocomplete="family-name" value="${esc(keep.prezime || '')}"></label>

    } else if (s.phase === 'question') {
      const q = s.q; const ans = Array.isArray(q.answers) ? q.answers : Object.values(q.answers || {}); const ord = this.order(s.qi, ans.length); const picked = this.picked[s.qi];
      this.shell(`<div class="thinbar"><i id="ptb" style="width:100%"></i></div>
        <div class="qhead"><span class="label" style="flex:1">Pitanje ${s.qi + 1} od ${s.total}</span><span class="mono" style="font-weight:700;font-size:1.2rem" id="pts">${s.time}</span></div>
        <p class="no-copy" style="font-family:var(--f-display);font-size:1.4rem;font-weight:700;line-height:1.2">${esc(q.text)}</p>
        ${q.image ? `<div class="qimg" style="max-width:100%"><img src="${q.image}" alt=""></div>` : ''}
        <div class="answers no-copy" id="pans">${ord.map((oi, pos) => `<button class="abtn c${pos} ${picked === undefined ? '' : (picked === oi ? 'picked' : 'dim')}" data-c="${oi}" ${picked !== undefined ? 'disabled' : ''}><span class="L">${LET[pos]}</span><span class="tx">${esc(ans[oi])}</span></button>`).join('')}</div>
        <p class="center muted" id="pmsg">${picked !== undefined ? 'Odgovor je zabilježen. Pričekajte rezultat.' : 'Odaberite jedan odgovor. Odabir se ne može promijeniti.'}</p>`, top);
      $('#pans').onclick = e => { const b = e.target.closest('[data-c]'); if (b && !b.disabled) this.answer(+b.dataset.c); };
      if (picked === undefined) DB.get(`games/${this.code}/answers/${s.qi}/${UID}`).then(a => { if (a && typeof a.c === 'number' && this.state.qi === s.qi && this.picked[s.qi] === undefined) { this.picked[s.qi] = a.c; this.render(null, true); } }).catch(() => {});
    } else if (s.phase === 'reveal') {
      const my = this.my && this.my.lastQ === s.qi ? this.my : null;
      const cls = !my ? 'na' : (!my.answered ? 'na' : (my.lastOk ? 'ok' : 'no'));
      const ans = Array.isArray(s.q.answers) ? s.q.answers : Object.values(s.q.answers || {});
      this.shell(`<div class="result ${cls}"><p class="label">${s.qi + 1}. pitanje</p>
        <h1>${cls === 'ok' ? 'Točno!' : cls === 'no' ? 'Netočno' : (my ? 'Niste odgovorili' : 'Provjeravam…')}</h1>
        ${my ? `<p class="muted">Točnih do sada: <b class="mono">${my.correct}</b> od ${s.qi + 1}</p>` : ''}</div>
        <div class="card"><p><span class="label">Točan odgovor</span><br><b style="font-size:1.15rem">${esc(ans[s.correct] || '')}</b></p></div>`, top);
    } else if (s.phase === 'end') {
      const b = Array.isArray(this.board) ? this.board : (this.board ? Object.values(this.board) : []);
      const my = this.my && this.my.rank ? this.my : null;
      this.shell(`<div class="result ${my && my.rank === 1 ? 'ok' : 'na'}"><p class="label">Kviz je završio</p><h1>${my ? my.rank + '. mjesto od ' + my.of : 'Računam poredak…'}</h1>
        ${my ? `<div class="pts">${fmtP(my.total)}</div><p class="muted">bodova${my.bonus ? ` (uključuje bonus ${fmtP(my.bonus)})` : ''} · ${my.correct} točnih od ${this.meta.total}</p>` : ''}</div>
        ${b.length ? `<div><p class="label" style="margin-bottom:.6rem">Poredak</p><div class="board">${b.map((r, i) => `<div class="brow"><span class="rk">${i + 1}.</span><span>${esc(r.n)}<br><small class="faint mono">${r.k} točnih · ${fmtS(r.t)} s</small></span><span class="pts">${fmtP(r.p)}</span></div>`).join('')}</div></div>` : ''}`, top);
      if (my && my.rank <= 3 && !this.confettiDone) { this.confettiDone = true; confetti(); }
      sset(sessionStorage, 'pv-code', '');
    }
  },
  async answer(c) {
    const s = this.state; if (!s || s.phase !== 'question' || this.picked[s.qi] !== undefined) return;
    if (DB.now() > s.at + s.time * 1000) return;
    this.picked[s.qi] = c;
    $$('#pans .abtn').forEach(b => { b.disabled = true; b.classList.add(+b.dataset.c === c ? 'picked' : 'dim'); });
    const m0 = $('#pmsg'); if (m0) m0.textContent = 'Šaljem…';
    try { await DB.set(`games/${this.code}/answers/${s.qi}/${UID}`, {c, at: DB.TS}); const m = $('#pmsg'); if (m) m.textContent = 'Odgovor je zabilježen. Pričekajte rezultat.'; }
    catch (e) { const m = $('#pmsg'); if (m) m.textContent = 'Odgovor nije prihvaćen: vrijeme je isteklo.'; }
  },
  tick() {
    const s = this.state; if (!s || typeof s.at !== 'number') return; const now = DB.now();
    if (s.phase === 'countdown') { const e = $('#pcd'); if (e) e.textContent = Math.max(0, Math.ceil((s.at + s.dur * 1000 - now) / 1000)); }
    if (s.phase === 'question') { const tot = s.time * 1000; const left = Math.max(0, s.at + tot - now); const t = $('#pts'); if (t) t.textContent = Math.ceil(left / 1000); const b = $('#ptb'); if (b) b.style.width = (100 * left / tot) + '%';
      if (left <= 0 && this.picked[s.qi] === undefined) { const bs = $$('#pans .abtn:not([disabled])'); if (bs.length) { bs.forEach(b => { b.disabled = true; b.classList.add('dim'); }); const m = $('#pmsg'); if (m) m.textContent = 'Vrijeme je isteklo.'; } } }
  }
};

boot();
})();

</script>
</body>
</html>
